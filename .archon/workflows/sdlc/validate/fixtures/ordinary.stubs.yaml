# Ordinary validation: only discovery is stubbed. The real runner executes the
# declared checks and every one exits 0, so the run is green and classify, which
# has no stub, is never reached.
discover:
  checks:
    - { name: "types", argv: ["bun", "-e", "console.log('types passed')"] }
    - { name: "tests", argv: ["bun", "-e", "console.log('tests passed')"] }
  quarantine: []
  notes: "stub: the project's checks"
# Not reached while the checks above pass: the second opinion runs only on red.
# Stubbed all the same, because the real runner decides that, and a fixture run
# inherits the operator's environment: were a check ever edited to fail, an
# unstubbed node would send its log to a live classifier.
failure-class: { status: unavailable, reason: no_api_key, choice: null, probabilities: {}, confidence: null, advisory: true }
fixture:
  expect: completed
  reached: [mode, discover, run, result]
exec-code: true
