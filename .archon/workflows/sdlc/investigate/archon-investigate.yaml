name: archon-investigate
description: |
  Establish the proven causal chain for a bug, unexplained behavior, or open
  question — to the root cause whose fix prevents the symptom, never the first
  plausible explanation — and write an evidence-backed report a fixer or
  planner can act on without repeating the work. Advisory: it reads,
  reproduces, and reports — the repository is left exactly as it was found.

  Use when: the cause is not yet known — "investigate this issue", "why does
  this fail", "root-cause this before we fix it".
  NOT for: deciding how to build the fix (plan), or building it (implement).

model: medium

inputs:
  target:
    default: ""
    description: >-
      What to investigate — an issue reference, a symptom, a failing command, or
      a question. When empty, the run's trigger message is the target.

# rooted:false is a valid completion (see the investigate node): the run succeeds
# with an authored outcome of false — lifecycle status and work outcome are separate facts.
returns: investigate
outcome_field: rooted

nodes:

  # Builds or refreshes this checkout's Codanna index for the investigate node's
  # Codanna tools. Never fails the run on purpose: the index only speeds up
  # navigation, and the agent falls back to ordinary reads when it is missing.
  - id: code-index
    bash: |
      timeout 540 codegraph --index 2>&1 || echo "code-index: FAILED; agent steps will use ordinary reads"
    timeout: 600000

  # Optional pre-read. With a classifier configured it names the files worth
  # opening first; without one it spends no AI turn and the investigate node runs as it
  # always has. It overlaps code-index rather than queueing behind it.
  - id: scout
    include: archon-scout
    with:
      request: "$INPUTS.target"

  # Inconclusive is a valid outcome, not a failure: rooted:false with the gaps
  # named honestly beats a confident guess. Consumers gate on
  # $investigate.output.rooted before building on the chain.
  - id: investigate
    depends_on: [code-index, scout]
    # The scout is skipped whenever it has nothing to say, and a skipped dependency
    # blocks the default all_success. A failed one still blocks this node.
    trigger_rule: none_failed_min_one_success
    command: investigate
    with:
      # `if_skipped` is what the prompt reads when no scout ran.
      scout: { from: "$scout.output", if_skipped: { status: unavailable, reason: not_run } }
    # Every Codanna tool, typed, over the index code-index built. `mcp:` is read
    # literally and a relative path would resolve inside the target checkout, so
    # this names the host's config absolutely. The file must exist or this workflow
    # fails validation; a missing `codegraph` only fails the server's connection,
    # which the run reports as a warning before continuing with ordinary reads.
    mcp: /home/killerherts/.archon/mcp/codanna.json
    # Advisory on both counts, and the engine holds both: it fails this node with
    # the touched paths named if the checkout is modified, and it refuses the
    # artifact pointer below if the report it names does not exist.
    mutates_checkout: false
    output_type: investigation-report
    output_format:
      type: object
      properties:
        rooted:
          type: boolean
        summary:
          type: string
        report:
          # The evidence contract, enforced by the engine at this node: a pointer at a
          # file this run's artifacts do not hold is refused before the node completes,
          # so a verdict cannot arrive without its report. The bar is an existing, non-empty
          # file, the bar the node this replaced enforced by hand.
          type: object
          properties:
            type: { type: string, enum: [archon_artifact] }
            run_id: { type: string }
            path: { type: string, enum: [investigation.md] }
          required: [type, run_id, path]
      required: [rooted, summary, report]
