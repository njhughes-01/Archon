name: archon-scout
description: |
  Pre-read a checkout for one focused question, so the agent that follows opens
  the files that matter first. A small agent turns the request into one yes/no
  question and the paths worth checking; a classifier then answers that question
  about every candidate file, in line windows. Advisory and optional: with no
  classifier configured it spends no AI turn and selects nothing.

  Use when: composed before an agent that is about to read a large checkout —
  investigate and plan include it.
  NOT for: answering the question itself, or deciding what to change.

inputs:
  request:
    default: ""
    description: >-
      The work the following agent was asked to do, in the caller's words. When
      empty, the run's trigger message is the request.

# A caller binds this with `if_skipped`: without a classifier, or when no single
# question fits the request, `classify` never runs and there is no result.
returns: classify

nodes:

  # The classifier is configured in the environment, which `when:` cannot read.
  # This is the gate that keeps an install without one from paying for the
  # question below; .shared/context-scout.ts owns what "configured" means.
  - id: config
    script: scout-config
    runtime: bun
    output_format:
      type: object
      properties:
        available: { type: boolean }
        reason: { type: string }
      required: [available, reason]

  # Turning a free-text request into one question is judgment, so an agent does
  # it; everything it returns is bounded again by the script that consumes it.
  - id: question
    command: scout-question
    # This workflow declares no top-level model, so its one AI node names its
    # tier. Writing a question and a list of paths is small-tier work.
    model: small
    depends_on: [config]
    when: "$config.output.available == true"
    mutates_checkout: false
    output_format:
      type: object
      properties:
        focused: { type: boolean }
        question: { type: string }
        paths:
          type: array
          items: { type: string }
      required: [focused, question, paths]

  # Never fails the run on purpose: every way the classifier cannot answer is an
  # `unavailable` result, and its own deadline ends it well before this timeout.
  # The timeout is the backstop, and it skips rather than fails.
  - id: classify
    script: context-scout
    runtime: bun
    depends_on: [question]
    when: "$question.output.focused == true"
    timeout: 300000
    on_timeout: skip
    with:
      question: "$question.output.question"
      paths: { from: "$question.output.paths" }
    output_format:
      type: object
      properties:
        status: { type: string, enum: [ok, unavailable, truncated] }
        reason: { type: string }
        question: { type: string }
        paths:
          type: array
          items: { type: string }
        files:
          type: array
          items:
            type: object
            properties:
              path: { type: string }
              relevant: { type: boolean }
              confidence: { type: number, minimum: 0, maximum: 1 }
              evidence:
                type: object
                properties:
                  startLine: { type: integer, minimum: 1 }
                  endLine: { type: integer, minimum: 1 }
                required: [startLine, endLine]
                additionalProperties: false
            required: [path, relevant, confidence, evidence]
            additionalProperties: false
        counts:
          type: object
          properties:
            candidates: { type: integer, minimum: 0 }
            excluded:
              type: object
              properties:
                ignored: { type: integer, minimum: 0 }
                secret: { type: integer, minimum: 0 }
                not_regular_file: { type: integer, minimum: 0 }
                too_large: { type: integer, minimum: 0 }
                binary: { type: integer, minimum: 0 }
                empty: { type: integer, minimum: 0 }
              required: [ignored, secret, not_regular_file, too_large, binary, empty]
              additionalProperties: false
            classified: { type: integer, minimum: 0 }
            relevant: { type: integer, minimum: 0 }
            unclassified: { type: integer, minimum: 0 }
            windows: { type: integer, minimum: 0 }
            requests: { type: integer, minimum: 0 }
            charsSent: { type: integer, minimum: 0 }
          required:
            - candidates
            - excluded
            - classified
            - relevant
            - unclassified
            - windows
            - requests
            - charsSent
          additionalProperties: false
      required: [status, reason, question, paths, files, counts]
      additionalProperties: false
